name: Build blog

# Regenera el HTML estatico del blog, posts/index.json y sitemap.xml a partir
# de posts/*.json, y commitea el resultado.
#
# Por que no entra en bucle, con dos cinturones independientes:
#   1. El push lo hace GITHUB_TOKEN, y GitHub no dispara workflows con el.
#   2. El filtro de paths no incluye blog/ ni sitemap.xml, que es justo lo que
#      escribe este workflow.
# pages-build-deployment SI se dispara con pushes del bot (ya ocurre con
# check-claude-code-updates.yml), asi que el despliegue sigue siendo automatico.

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/build-blog.mjs'
      - 'scripts/templates.mjs'
      - '.github/workflows/build-blog.yml'
  pull_request:
    paths:
      - 'posts/**'
      - 'scripts/build-blog.mjs'
      - 'scripts/templates.mjs'
  workflow_dispatch:

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: dateModified y lastmod salen de git log, no de
          # new Date(). Sin esto todas las fechas colapsarian al dia del build.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # En un PR solo se valida: si el HTML generado no coincide con el commit,
      # falla y lo enseña, en vez de escribir en la rama de otro.
      - name: Validar (solo PR)
        if: github.event_name == 'pull_request'
        run: node scripts/build-blog.mjs --check

      - name: Generar blog
        if: github.event_name != 'pull_request'
        run: node scripts/build-blog.mjs

      - name: Commit si hay cambios
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml posts/index.json
          if git diff --staged --quiet; then
            echo "Sin cambios que commitear."
            exit 0
          fi
          git commit -m "chore(blog): regenerar HTML estatico, indice y sitemap"
          git push
