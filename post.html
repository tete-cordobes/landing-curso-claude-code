<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo…</title>
    <link rel="canonical" href="https://www.ccodecurso.com/blog/">
    <script>
        (function () {
            var slug = new URLSearchParams(window.location.search).get('slug');
            var dest = slug
                ? '/blog/' + encodeURIComponent(slug).replace(/%2F/g, '') + '/'
                : '/#formulario';
            window.location.replace(dest);
        })();
    </script>
</head>
<body>
    <p>Esta página se ha movido. <a href="/#formulario">Descargar la guía gratis</a> o <a href="/blog/">ir al blog</a>.</p>
</body>
</html>
